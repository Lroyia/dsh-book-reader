name: Publish to npm

# 推送 v* 标签即发布：版本号必须与 package.json 一致，否则拒绝发布。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          scope: lroyia

      - name: 核对版本号
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::标签 $TAG 与 package.json 的版本 $VERSION 不一致"
            exit 1
          fi
          echo "发布 $NAME@$VERSION"

      - name: 检查凭据
        run: |
          if ! npm whoami; then
            echo "::error::NPM_TOKEN 无效，或没有这个包的发布权限"
            exit 1
          fi
          echo "以 $(npm whoami) 的身份发布"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 发布到 npm
        run: |
          if ! npm publish --provenance --access public; then
            echo "::error::发布失败。若 npm 报 403 且提示 Two-factor authentication，说明这枚 NPM_TOKEN 没有勾选「Bypass two-factor authentication」——请到 npmjs.com → Access Tokens 重新生成一枚 granular token，勾上该选项，权限选 Read and write (publish and stage)，包范围选 All Packages。"
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
