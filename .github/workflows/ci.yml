name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 语法检查
        run: |
          for file in index.js client.js lib/*.js; do
            node --check "$file"
          done

      - name: package.json 与补丁文件
        run: |
          node -e "const p = require('./package.json'); if (!p.dsh?.bundle?.patch) { throw new Error('缺少 dsh.bundle.patch'); } console.log(p.name + '@' + p.version)"
          node -e "const fs = require('fs'); const text = fs.readFileSync('cordis.patch.yml', 'utf8'); if (!text.includes('@lroyia/dsh-book-reader')) { throw new Error('cordis.patch.yml 里的包名与 package.json 不一致'); }"
